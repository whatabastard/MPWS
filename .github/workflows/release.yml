name: Publish MPWS release
on:
  push:
    branches: [main]
    paths: [MPWS.csproj]
jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release MPWS ')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone Windows executable
        run: dotnet publish MPWS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release
      - name: Publish tagged executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content MPWS.csproj -Raw)).Project.PropertyGroup.Version
          $hash = (Get-FileHash release/mpws.exe -Algorithm SHA256).Hash
          $notes = "Автономная сборка для Windows x64. Диагностика планировщика задач, приоритетов, TCP и питания USB. Поиск по симптому и коду ошибки. Сравнение параметров TDR со значениями Microsoft.`n`nSHA-256 (mpws.exe): $hash"
          gh release create "v$version" release/mpws.exe --target $env:GITHUB_SHA --title "MPWS $version" --notes $notes
